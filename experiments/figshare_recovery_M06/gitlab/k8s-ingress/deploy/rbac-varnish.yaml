kind: Role
apiVersion: rbac.authorization.k8s.io/v1beta1
metadata:
  name: varnish-ingress
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1beta1
metadata:
  name: varnish-ingress
subjects:
- kind: ServiceAccount
  namespace: default
  name: varnish-ingress
roleRef:
  kind: Role
  name: varnish-ingress
  apiGroup: rbac.authorization.k8s.io
