apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: coffee-ingress
  namespace: coffee
  annotations:
    kubernetes.io/ingress.class: "varnish"
    ingress.varnish-cache.org/varnish-svc: "kube-system/varnish-ingress-admin"
spec:
  rules:
  - host: coffee.example.com
    http:
      paths:
      - backend:
          serviceName: coffee-svc
          servicePort: 80
