apiVersion: v1
kind: Pod
metadata:
  name: docker-socket-insecure
  namespace: sli-kube-repro
spec:
  hostPID: false
  hostIPC: false
  hostNetwork: false
  volumes:
    - name: runtime-socket
      hostPath:
        path: /var/run/docker.sock
  containers:
    - name: app
      image: nginx:1.25.5
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: runtime-socket
          mountPath: /var/run/runtime.sock
