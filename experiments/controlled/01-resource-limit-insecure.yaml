apiVersion: v1
kind: Pod
metadata:
  name: resource-limit-insecure
  namespace: sli-kube-repro
spec:
  hostPID: false
  hostIPC: false
  hostNetwork: false
  containers:
    - name: app
      image: nginx:1.25.5
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
