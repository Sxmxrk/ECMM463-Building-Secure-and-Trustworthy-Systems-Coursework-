apiVersion: v1
kind: Pod
metadata:
  name: priv-escalation-insecure
  namespace: sli-kube-repro
spec:
  hostPID: false
  hostIPC: false
  hostNetwork: false
  containers:
    - name: app
      image: nginx:1.25.5
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: true
        capabilities:
          drop:
            - ALL
