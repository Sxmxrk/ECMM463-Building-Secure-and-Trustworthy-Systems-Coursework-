kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: varnish-ingress
  namespace: cafe
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: varnish-ingress
  namespace: cafe
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1beta1
metadata:
  name: varnish-ingress
  namespace: cafe
subjects:
- kind: ServiceAccount
  name: varnish-ingress
  namespace: cafe
roleRef:
  kind: Role
  name: varnish-ingress
  apiGroup: rbac.authorization.k8s.io
