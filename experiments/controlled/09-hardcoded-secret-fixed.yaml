apiVersion: v1
kind: Pod
metadata:
  name: secret-reference-fixed
  namespace: sli-kube-repro
spec:
  containers:
    - name: app
      image: nginx:1.25.5
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
      env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: externally-managed-secret
              key: password
